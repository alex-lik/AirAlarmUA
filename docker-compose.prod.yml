services:
  air-alert-api:
    build: .
    container_name: air-alert-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=*
      - UPDATE_INTERVAL=60
      - REQUEST_TIMEOUT=15
      - MAX_RETRIES=3
      - MAX_FAILURES=5
      - RATE_LIMIT=100/10minutes
      - ALERTS_API_TOKEN=${ALERTS_API_TOKEN}
      - ALERTS_API_URL=${ALERTS_API_URL:-https://api.alerts.in.ua/v1/iot/active_air_raid_alerts.json}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - SENTRY_DSN=${SENTRY_DSN}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - air-alert-network

networks:
  air-alert-network:
    driver: bridge
